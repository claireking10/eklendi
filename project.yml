name: Eklendi
options:
  bundleIdPrefix: devplaceholder.B1Q5FZOR
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Eklendi:
    type: application
    platform: iOS
    sources:
      - path: Eklendi
      - path: GoogleService-Info.plist
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: devplaceholder.B1Q5FZOR.MyApp
        PRODUCT_NAME: Eklendi
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
  EklendiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [EklendiTests]
    dependencies:
      - target: Eklendi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  EklendiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EklendiUITests]
    dependencies:
      - target: Eklendi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Eklendi:
    build:
      targets:
        Eklendi: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [EklendiTests, EklendiUITests]
