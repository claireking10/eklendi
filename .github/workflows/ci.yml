name: CI
on:
  push:
    branches: ["hackathon/**", "milestone-**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Cloud Functions (build + logic tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: functions } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test

  ios:
    name: iOS (build + unit + UI tests)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore GoogleService-Info.plist from secret (optional)
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "$PLIST_B64" ]; then echo "$PLIST_B64" | base64 --decode > GoogleService-Info.plist; fi
      - run: brew install xcodegen
      - run: ./scripts/make-secrets.sh
      - run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -oE 'iPhone 1[5-7][^(]*' | head -1 | sed 's/ *$//')
          echo "name=${NAME:-iPhone 16}" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test -project Eklendi.xcodeproj -scheme Eklendi \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "error:|warning: unre|Test Case|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: xcodebuild-log, path: xcodebuild.log }
